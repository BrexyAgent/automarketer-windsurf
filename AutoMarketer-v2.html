<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AutoMarketer — AI Marketing Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111118;
  --c1:#18181F;
  --c2:#1E1E28;
  --c3:#252532;
  --b1:#2C2C3E;
  --b2:#363650;
  --t1:#E8E8F2;
  --t2:#7070A0;
  --t3:#3A3A58;
  --acc:#6C5CE7;
  --acc2:#8B7EF8;
  --acc-bg:rgba(108,92,231,.12);
  --grn:#00B894;
  --grn-bg:rgba(0,184,148,.12);
  --amb:#FDCB6E;
  --amb-bg:rgba(253,203,110,.12);
  --red:#E17055;
  --red-bg:rgba(225,112,85,.12);
  --blu:#0984E3;
  --blu-bg:rgba(9,132,227,.12);
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55;font-weight:400}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}
input,textarea,select,button{font-family:inherit;font-size:14px;color:var(--t1);font-weight:400}

/* ── Layout ── */
#shell{display:flex;height:100vh;overflow:hidden}
#sb{width:236px;min-width:236px;background:var(--c1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
#sb.col{width:54px;min-width:54px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#bar{padding:11px 26px;border-bottom:1px solid var(--b1);background:var(--c1);display:flex;align-items:center;gap:12px;flex-shrink:0}
#pg{flex:1;overflow-y:auto;padding:28px 32px}
#logo-row{padding:13px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mk{width:30px;height:30px;min-width:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
#sb-tog{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--t3);font-size:16px;line-height:1;flex-shrink:0;padding:3px 5px;border-radius:5px;transition:color .12s}
#sb-tog:hover{color:var(--t2)}
#nav{flex:1;overflow-y:auto;padding:8px}
.ng{font-size:9px;color:var(--t3);font-weight:500;letter-spacing:.09em;text-transform:uppercase;padding:14px 10px 5px;white-space:nowrap}
.ni{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:7px;cursor:pointer;background:transparent;border:1px solid transparent;color:var(--t2);font-size:12px;font-weight:400;margin-bottom:1px;transition:all .12s;text-align:left;white-space:nowrap}
.ni:hover{background:var(--c2);color:var(--t1)}
.ni.on{background:var(--acc-bg);color:var(--acc2);border-color:rgba(108,92,231,.18);font-weight:500}
.ni-ic{font-size:13px;flex-shrink:0;width:16px;text-align:center}
.ni-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;padding:1px 6px;font-size:10px;font-weight:500}

/* ── Cards ── */
.card{background:var(--c1);border:1px solid var(--b1);border-radius:12px;padding:20px 22px}
.card-sm{background:var(--c2);border:1px solid var(--b1);border-radius:8px;padding:11px 13px}
.stat{background:var(--c1);border:1px solid var(--b1);border-radius:12px;padding:16px 18px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pg-title{font-size:20px;font-weight:600;letter-spacing:-.2px;color:var(--t1)}
.pg-sub{font-size:12px;color:var(--t2);margin-top:4px;font-weight:400}
.clbl{font-size:10px;color:var(--t2);font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:13px}

/* ── Stat numbers — lighter weight ── */
.stat-num{font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.stat-lbl{font-size:10px;color:var(--t2);font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}

/* ── Buttons ── */
.btn{padding:7px 15px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .12s;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.bp{background:var(--acc);color:#fff}
.bg{background:transparent;color:var(--t2);border:1px solid var(--b2)!important}
.bg:hover{color:var(--t1)}
.bs{background:var(--grn-bg);color:var(--grn);border:1px solid rgba(0,184,148,.22)!important}
.bd{background:var(--red-bg);color:var(--red);border:1px solid rgba(225,112,85,.22)!important}
.ba{background:var(--acc-bg);color:var(--acc2);border:1px solid rgba(108,92,231,.22)!important}
.bam{background:var(--amb-bg);color:#c9a227;border:1px solid rgba(253,203,110,.25)!important}
.bsm{padding:5px 11px;font-size:11px}.bfw{width:100%;padding:11px;justify-content:center}

/* ── Inputs ── */
.inp{background:var(--c2);border:1px solid var(--b1);border-radius:7px;padding:9px 13px;font-size:13px;color:var(--t1);width:100%;outline:none;font-weight:400;transition:border-color .12s}
.inp:focus{border-color:var(--acc)}
.ta{background:var(--c2);border:1px solid var(--b1);border-radius:7px;padding:9px 13px;font-size:13px;color:var(--t1);width:100%;outline:none;resize:vertical;font-weight:400;transition:border-color .12s}
.ta:focus{border-color:var(--acc)}
.sel{background:var(--c2);border:1px solid var(--b1);border-radius:7px;padding:9px 13px;font-size:13px;color:var(--t1);outline:none;width:100%;font-weight:400}
.lbl{font-size:11px;color:var(--t2);font-weight:400;display:block;margin-bottom:5px}

/* ── Status Badges — solid bg, WHITE text ── */
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:500;line-height:1.4;color:#fff}
.bdg-published{background:#00B894}
.bdg-pending{background:#D4A017}
.bdg-approved{background:#6C5CE7}
.bdg-rejected{background:#E17055}
.bdg-auto{background:#0984E3}
.bdg-draft{background:#555570}
.bdg-scheduled{background:#00B894}

/* ── Platform chips — each platform has unique color ── */
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:5px;font-size:11px;font-weight:500;line-height:1.4;vertical-align:middle;color:#fff}
.pc-instagram{background:#C13584}
.pc-linkedin{background:#0A66C2}
.pc-twitter{background:#1A8CD8}
.pc-facebook{background:#1877F2}
.pc-tiktok{background:#010101;border:1px solid #333}
.pc-youtube{background:#CC0000}
.pc-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.7);flex-shrink:0}

/* ── Misc ── */
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lbox{display:flex;align-items:center;gap:10px;color:var(--t2);font-size:13px;padding:16px 0;font-weight:400}
.prog{height:4px;background:var(--b1);border-radius:2px;overflow:hidden;margin:4px 0}
.progf{height:100%;border-radius:2px;transition:width .7s ease}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:160px;color:var(--t3);font-size:12px;gap:10px;text-align:center;font-weight:400}

/* ── Table ── */
.dt{width:100%;border-collapse:collapse}
.dt th{text-align:left;padding:8px 12px;font-size:10px;color:var(--t2);font-weight:500;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--b1)}
.dt td{padding:10px 12px;border-bottom:1px solid var(--b1);font-size:13px;color:var(--t1);font-weight:400}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:var(--c2)}
.qi{display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--c2);border-radius:8px;border:1px solid var(--b1);margin-bottom:6px}

/* ── Alert banners — solid bg, white text ── */
.al{padding:11px 14px;border-radius:8px;font-size:12px;margin-bottom:12px;line-height:1.65;font-weight:400;color:#fff}
.al-r{background:rgba(225,112,85,.15);border:1px solid rgba(225,112,85,.3);color:#ffb9a5}
.al-g{background:rgba(0,184,148,.12);border:1px solid rgba(0,184,148,.25);color:#7FFFD4}
.al-a{background:rgba(212,160,23,.12);border:1px solid rgba(212,160,23,.25);color:#FDE68A}
.al-ac{background:var(--acc-bg);border:1px solid rgba(108,92,231,.22);color:var(--acc2)}

.tabs{display:flex;gap:2px;background:var(--c2);border-radius:9px;padding:3px;margin-bottom:18px;border:1px solid var(--b1)}
.tab{flex:1;padding:7px;text-align:center;border-radius:7px;cursor:pointer;font-size:12px;font-weight:400;color:var(--t2);border:none;background:transparent;font-family:inherit;transition:all .12s}
.tab.on{background:var(--c1);color:var(--t1);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ── Modal ── */
#mov{position:fixed;inset:0;background:rgba(5,5,12,.88);display:flex;align-items:center;justify-content:center;z-index:8000;backdrop-filter:blur(10px)}
#mov.h{display:none}
.modal{background:var(--c1);border:1px solid var(--b2);border-radius:14px;padding:24px;max-width:580px;width:94%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.mt{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;color:var(--t1)}

/* ── Setup screen ── */
#setup-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
#setup-screen.h{display:none}

/* ── Post cards ── */
.post-card{background:var(--c1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;transition:border-color .15s;margin-bottom:10px;cursor:pointer}
.post-card:hover{border-color:var(--acc)}
.k-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.k-col-h{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--c2);border-radius:7px;margin-bottom:9px;border:1px solid var(--b1)}
.k-card{padding:12px;background:var(--c1);border:1px solid var(--b1);border-radius:8px;margin-bottom:7px;cursor:pointer;transition:border-color .12s}
.k-card:hover{border-color:var(--acc)}
.k-card.ov{border-color:var(--red)!important;background:rgba(225,112,85,.05)}
.cal-cell{min-height:74px;background:var(--c2);border-radius:8px;padding:5px;border:1px solid var(--b1);cursor:pointer;transition:border-color .12s}
.cal-cell:hover,.cal-cell.tod{border-color:var(--acc)}
.cal-post{font-size:9px;padding:2px 5px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:#fff}
.pipe-step{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;background:var(--c2);border-radius:9px;border:1px solid var(--b1);margin-bottom:8px;transition:all .3s}
.pipe-step.run{border-color:var(--acc);background:rgba(108,92,231,.06)}
.pipe-step.done{border-color:var(--grn);background:rgba(0,184,148,.06)}
.pipe-step.err{border-color:var(--red);background:rgba(225,112,85,.06)}
.ps-dot{width:36px;height:36px;min-width:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.ps-dot.wait{background:var(--c3);color:var(--t3)}
.ps-dot.run{background:var(--acc-bg);color:var(--acc2)}
.ps-dot.done{background:var(--grn-bg);color:var(--grn)}
.ps-dot.err{background:var(--red-bg);color:var(--red)}
.brand-sel{background:var(--c2);border:1px solid var(--b1);border-radius:7px;padding:7px 11px;font-size:12px;color:var(--t1);cursor:pointer;font-family:inherit;font-weight:400;width:100%;outline:none}
.gpb,.pbtn{padding:7px 13px;border-radius:7px;font-size:12px;font-weight:400;cursor:pointer;background:var(--c2);color:var(--t2);border:1px solid var(--b1);font-family:inherit;transition:all .12s;display:inline-flex;align-items:center;gap:7px}
.gpb:hover,.pbtn:hover{color:var(--t1)}
</style>
</head>
<body>
<div id="setup-screen">
  <div style="max-width:380px;width:100%">
    <div style="text-align:center;margin-bottom:36px">
      <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#6C5CE7,#9D8FFB);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin:0 auto 16px;color:#fff">A</div>
      <div style="font-size:24px;font-weight:700;color:var(--t1)">AutoMarketer</div>
      <div style="font-size:12px;color:var(--t2);margin-top:5px">AI Marketing Platform</div>
    </div>
    <div id="login-box" class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:18px;color:var(--t1)">Sign in</div>
      <div style="display:flex;flex-direction:column;gap:13px">
        <div><label class="lbl">Email address</label><input class="inp" id="login-email" placeholder="you@email.com" type="email" autocomplete="email"></div>
        <div><label class="lbl">Password</label><input class="inp" id="login-pass" placeholder="Your password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <div id="login-err" style="font-size:12px;min-height:14px"></div>
        <button class="btn bp bfw" onclick="doLogin()" style="padding:12px;font-size:13px;margin-top:2px">Sign In</button>
        <div style="text-align:center;font-size:12px;color:var(--t2)">No account yet? <span style="color:var(--acc2);cursor:pointer;font-weight:500" onclick="showSignup()">Create account</span></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:16px">
      <button class="btn bg bsm" onclick="launchDemo()" style="font-size:11px;color:var(--t3)">Try Demo Mode</button>
    </div>
  </div>

  <!-- SIGNUP (hidden by default) -->
  <div id="signup-box" style="max-width:380px;width:100%;display:none">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#6C5CE7,#9D8FFB);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin:0 auto 14px;color:#fff">A</div>
      <div style="font-size:22px;font-weight:700;color:var(--t1)">Create Account</div>
      <div style="font-size:12px;color:var(--t2);margin-top:4px">Set up your AutoMarketer account</div>
    </div>
    <div class="card">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="g2" style="gap:9px">
          <div><label class="lbl">Your Name</label><input class="inp" id="su-fname" placeholder="Sunny"></div>
          <div><label class="lbl">Agency</label><input class="inp" id="su-agency" placeholder="Shangari Group"></div>
        </div>
        <div><label class="lbl">Email</label><input class="inp" id="su-email" placeholder="amit@risingcap.co" type="email"></div>
        <div><label class="lbl">Password</label><input class="inp" id="su-pass" placeholder="Min 8 characters" type="password"></div>
        <div id="su-err" style="font-size:12px;min-height:14px"></div>
        <button class="btn bp bfw" onclick="doSignup()" style="padding:12px;font-size:13px">Create Account</button>
        <div style="text-align:center;font-size:12px;color:var(--t2)">Have an account? <span style="color:var(--acc2);cursor:pointer;font-weight:500" onclick="showLogin()">Sign in</span></div>
      </div>
    </div>
  </div>
</div>

<div id="mov" class="h"><div class="modal" id="mbody"></div></div>
<div id="shell" style="display:none">
  <div id="sb">
    <div id="logo-row">
      <div class="logo-mk">A</div>
      <div id="logo-txt" style="flex:1"><div style="font-size:13px;font-weight:600">AutoMarketer</div><div style="font-size:10px;color:var(--t2)" id="sb-sub">AI Marketing Platform</div></div>
      <button id="sb-tog" onclick="toggleSB()">&#8801;</button>
    </div>
    <div style="padding:8px;border-bottom:1px solid var(--b1)">
      <select class="brand-sel" id="brand-sel" onchange="switchBrand(this.value)"><option>Loading...</option></select>
    </div>
    <div id="nav"></div>
    <div id="sb-foot" style="padding:9px 14px;border-top:1px solid var(--b1);font-size:11px;flex-shrink:0;display:flex;align-items:center;gap:6px">
      <span id="foot-dot" style="width:7px;height:7px;border-radius:50%;background:var(--grn);display:inline-block"></span>
      <span id="foot-txt" style="color:var(--grn)">System Active</span>
    </div>
  </div>
  <div id="main">
    <div id="bar">
      <div style="flex:1"><div id="bc" style="font-size:11px;color:var(--t2)">Overview &rsaquo; <span style="color:var(--t1);font-weight:600">Dashboard</span></div></div>
      <div style="display:flex;gap:7px;align-items:center">
        <div id="bar-intel"></div>
        <button class="btn bg bsm" onclick="showCfg()">&#9881; Settings</button>
        <div style="width:1px;height:18px;background:var(--b1)"></div>
        <div id="bar-brand" style="font-size:11px;color:var(--t2)"></div>
        <div style="width:32px;height:32px;border-radius:10px;background:var(--acc-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--acc2)" id="bar-av">SG</div>
      </div>
    </div>
    <div id="pg"></div>
  </div>
</div>
<script>
var CFG={
  sbUrl:   localStorage.getItem('am_sb_url')||'',
  sbKey:   localStorage.getItem('am_sb_key')||'',
  antKey:  localStorage.getItem('am_ant_key')||'',
  serpKey: localStorage.getItem('am_serp_key')||''
};
var SB=null;
var S={view:'dashboard',sbc:false,brands:[],cur:null,posts:[],approval:[],intel:null,reports:[],charts:{},demo:false};
var PCOL={instagram:'#E1306C',linkedin:'#0A66C2',twitter:'#1DA1F2',facebook:'#1877F2',tiktok:'#69C9D0',youtube:'#FF0000'};
var PL=[{id:'instagram',name:'Instagram',color:'#E1306C',abbr:'IG'},{id:'linkedin',name:'LinkedIn',color:'#0A66C2',abbr:'in'},{id:'twitter',name:'Twitter / X',color:'#1DA1F2',abbr:'X'},{id:'facebook',name:'Facebook',color:'#1877F2',abbr:'fb'},{id:'tiktok',name:'TikTok',color:'#2FD6E0',abbr:'TT'},{id:'youtube',name:'YouTube',color:'#FF4444',abbr:'YT'}];
var NAV=[
  {g:'Overview',items:[{id:'dashboard',label:'Dashboard',i:'◉'},{id:'brands',label:'All Brands',i:'◈'}]},
  {g:'Automation',items:[{id:'pipeline',label:'Intelligence Pipeline',i:'⚡'},{id:'generate',label:'Auto Generate',i:'✦'}]},
  {g:'Content',items:[{id:'approval',label:'Approval Queue',i:'✓',b:'approval'},{id:'calendar',label:'Calendar',i:'▦'},{id:'posts',label:'All Posts',i:'◻'}]},
  {g:'Analytics',items:[{id:'analytics',label:'Analytics',i:'◈'},{id:'reports',label:'Weekly Reports',i:'📊'},{id:'competitor',label:'Competitors',i:'🔍'},{id:'hashtag',label:'Hashtags',i:'#'},{id:'sentiment',label:'Sentiment',i:'◎'}]},
  {g:'AI Agents',items:[{id:'seoblog',label:'SEO Blog (Claude)',i:'✍'},{id:'seoblog_n8n',label:'SEO Blog (n8n)',i:'⚙'},{id:'bloglibrary',label:'Blog Library',i:'◻'}]},{g:'Automation',items:[{id:'workflows',label:'Workflows',i:'⚡'}]},{g:'Settings',items:[{id:'brand',label:'Brand Voice',i:'◆'},{id:'notifications',label:'Notifications',i:'🔔'},{id:'integrations',label:'Integrations',i:'⚙'},{id:'apikeys',label:'API Keys',i:'⚿'}]}
];

function stBdgCls(st){
  var m={published:'background:#00B894',pending_approval:'background:#D4A017',approved:'background:#6C5CE7',auto_approved:'background:#0984E3',rejected:'background:#E17055',draft:'background:#555570',scheduled:'background:#00B894'};
  return m[st]||'background:#555570';
}
function stBdgHtml(st){
  return '<span class="bdg" style="'+stBdgCls(st)+'">'+ec(st||'')+'</span>';
}
function pb(pl){
  var MAP={
    instagram:{bg:'#C13584',label:'Instagram'},
    linkedin:{bg:'#0A66C2',label:'LinkedIn'},
    twitter:{bg:'#1A8CD8',label:'Twitter / X'},
    facebook:{bg:'#1877F2',label:'Facebook'},
    tiktok:{bg:'#2FD6E0',label:'TikTok'},
    youtube:{bg:'#CC0000',label:'YouTube'},
  };
  var m=MAP[pl]||{bg:'#6C5CE7',label:(pl||'?')};
  return '<span class="pchip" style="background:'+m.bg+'"><span class="pc-dot"></span>'+ec(m.label)+'</span>';
}

  try{

  (ov.length?'<div class="al al-r">⚠ <b>'+ov.length+' post'+(ov.length>1?'s':'')+' past auto-approve deadline</b> — n8n will publish them automatically soon. Edit now if needed.</div>':'')+

  '<div class="k-board">'+[['pending_approval','Pending',pend,'var(--amb)'],['approved','Approved',appr.concat(ba.filter(function(p){return p.status==='auto_approved';})),'var(--grn)'],['published','Published',pub,'var(--blu)'],['rejected','Rejected',rej,'var(--red)']].map(function(col){

    items.map(function(p){
      var ovi=isOv(p.approval_deadline)&&stage==='pending_approval';

      (ovi?'<div class="bdg" style="background:var(--red-bg);color:var(--red);margin-bottom:5px;display:inline-block;font-size:10px">OVERDUE</div>':'')+
      (hl!==null&&!ovi&&stage==='pending_approval'?'<div style="font-size:10px;color:var(--amb);margin-bottom:5px">⏱ '+hl+'h to auto-approve</div>':'')+
      '<div style="font-size:12px;line-height:1.45;margin-bottom:6px">'+ec((p.content||'').slice(0,100))+(p.content&&p.content.length>100?'...':'')+'</div>'+
      (p.hashtags&&p.hashtags.length?'<div style="font-size:10px;color:var(--acc2);margin-bottom:6px">'+ec(p.hashtags.slice(0,3).map(function(h){return '#'+h;}).join(' '))+'</div>':'')+
      '<div style="font-size:10px;color:var(--t2);margin-bottom:7px">by '+ec(p.author||'AI')+'</div>'+
      '<div style="display:flex;gap:4px;flex-wrap:wrap">'+
      (stage==='pending_approval'?'<button class="btn bs bsm" onclick="event.stopPropagation();qApprove(\''+ec(p.id)+'\')">✓</button><button class="btn bd bsm" onclick="event.stopPropagation();qReject(\''+ec(p.id)+'\')">✕</button><button class="btn bg bsm" onclick="event.stopPropagation();aprEdit(\''+ec(p.id)+'\')">✏</button>':'')+
      (stage==='approved'||stage==='auto_approved'?'<button class="btn bp bsm" onclick="event.stopPropagation();pubPost(\''+ec(p.id)+'\')">Publish →</button>':'')+

async function qApprove(id){
  var p=S.approval.find(function(x){return String(x.id)===String(id);})||S.posts.find(function(x){return String(x.id)===String(id);});
  if(p){p.status='approved';p.approved_at=new Date().toISOString();}
  if(!S.demo&&SB)await SB.from('posts').update({status:'approved',approved_at:new Date().toISOString()}).eq('id',id);
  closeModal();buildNav();go('approval');
}
async function qReject(id){
  var p=S.approval.find(function(x){return String(x.id)===String(id);})||S.posts.find(function(x){return String(x.id)===String(id);});
  if(p)p.status='rejected';
  if(!S.demo&&SB)await SB.from('posts').update({status:'rejected'}).eq('id',id);
  closeModal();buildNav();go('approval');
}
async function pubPost(id){
  var p=S.approval.find(function(x){return String(x.id)===String(id);})||S.posts.find(function(x){return String(x.id)===String(id);});
  if(p){p.status='published';p.published_at=new Date().toISOString();}
  if(!S.demo&&SB)await SB.from('posts').update({status:'published',published_at:new Date().toISOString()}).eq('id',id);
  closeModal();buildNav();go('approval');
}
async function approveAll(){
  var b=S.cur;
  var pend=S.approval.filter(function(p){return p.status==='pending_approval'&&(!b||p.brand_id===b.id);});
  pend.forEach(function(p){p.status='approved';p.approved_at=new Date().toISOString();});
  if(!S.demo&&SB){for(var i=0;i<pend.length;i++)await SB.from('posts').update({status:'approved',approved_at:new Date().toISOString()}).eq('id',pend[i].id);}
  buildNav();go('approval');
}
function aprEdit(id){
  var p=S.approval.find(function(x){return String(x.id)===String(id);})||S.posts.find(function(x){return String(x.id)===String(id);});
  if(!p)return;
  showModal('<div class="mt"><span>Edit &amp; Review Post</span><button class="btn bg bsm" onclick="closeModal()">✕</button></div>'+
  '<div style="display:flex;flex-direction:column;gap:11px">'+
  '<div style="display:flex;gap:8px;align-items:center">'+pb(p.platform)+'<span style="font-size:12px;color:var(--t2)">by '+ec(p.author||'AI')+'</span></div>'+
  (p.image_url?'<img src="'+p.image_url+'" style="width:100%;border-radius:8px;max-height:160px;object-fit:cover" onerror="this.style.display=\'none\'">':'')+
  '<div><label class="lbl">Edit Content</label><textarea class="ta" id="ae-txt" rows="7">'+ec(p.content||'')+'</textarea></div>'+
  '<div><label class="lbl">Hashtags (comma separated)</label><input class="inp" id="ae-ht" value="'+ec((p.hashtags||[]).join(', '))+'"></div>'+
  '<div class="g2" style="gap:8px"><div><label class="lbl">Publish Date</label><input class="inp" type="date" id="ae-d" value="'+(p.scheduled_at||td()).split('T')[0]+'"></div><div><label class="lbl">Status</label><select class="sel" id="ae-st"><option value="pending_approval"'+(p.status==='pending_approval'?' selected':'')+'>Pending</option><option value="approved"'+(p.status==='approved'?' selected':'')+'>Approved</option><option value="published"'+(p.status==='published'?' selected':'')+'>Published</option><option value="rejected"'+(p.status==='rejected'?' selected':'')+'>Rejected</option></select></div></div>'+
  '<div style="display:flex;gap:8px"><button class="btn bs" style="flex:1" onclick="saveAprEdit(\''+id+'\')">✓ Save &amp; Approve</button><button class="btn bd" onclick="qReject(\''+id+'\');closeModal()">Reject</button></div></div>');
  window.saveAprEdit=async function(pid){
    var p2=S.approval.find(function(x){return String(x.id)===String(pid);})||S.posts.find(function(x){return String(x.id)===String(pid);});
    if(!p2)return;
    p2.content=document.getElementById('ae-txt').value;
    p2.hashtags=document.getElementById('ae-ht').value.split(',').map(function(h){return h.trim().replace(/^#/,'');}).filter(Boolean);
    var d2=document.getElementById('ae-d').value;if(d2)p2.scheduled_at=d2+'T'+(p2.best_time||'09:00')+':00';
    p2.status=document.getElementById('ae-st').value;p2.approved_at=new Date().toISOString();
    if(!S.demo&&SB)await SB.from('posts').update({content:p2.content,hashtags:p2.hashtags,scheduled_at:p2.scheduled_at,status:p2.status,approved_at:p2.approved_at}).eq('id',pid);
    closeModal();buildNav();go('approval');
  };
}
// CALENDAR
var _cm=new Date().getMonth(),_cy=new Date().getFullYear();
function vCalendar(){
  var b=S.cur;var bp=S.posts.filter(function(p){return !b||p.brand_id===b.id;});
  var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dim=new Date(_cy,_cm+1,0).getDate(),fd=new Date(_cy,_cm,1).getDay(),tds=td();
  var cells='';
  for(var i=0;i<fd;i++)cells+='<div></div>';
  for(var d=1;d<=dim;d++){
    var ds=_cy+'-'+String(_cm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dp=bp.filter(function(p){return (p.scheduled_at||'').split('T')[0]===ds;});
    var isT=ds===tds;
    cells+='<div class="cal-cell'+(isT?' tod':'')+'" data-date="'+ds+'" onclick="calDay(this)">'+
    '<div style="font-size:11px;font-weight:'+(isT?700:400)+';color:'+(isT?'var(--acc2)':'var(--t2)')+';margin-bottom:2px">'+d+'</div>'+
    dp.slice(0,3).map(function(p){var col=PCOL[p.platform]||'#8B5CF6';return '<div class="cal-post" style="background:'+col+'22;color:'+col+'" onclick="event.stopPropagation();viewPost(\''+ec(p.id)+'\')" title="'+ec(p.content||'')+'">'+p.platform.slice(0,3)+'</div>';}).join('')+
    (dp.length>3?'<div style="font-size:9px;color:var(--t2)">+'+( dp.length-3)+'</div>':'')+
    '</div>';
  }
  var sched=bp.filter(function(p){return p.status==='pending_approval'||p.status==='approved'||p.status==='scheduled';}).length;
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px"><div><div class="pg-title">Content Calendar</div><div class="pg-sub">'+bp.length+' total &nbsp;·&nbsp; '+sched+' scheduled</div></div><button class="btn bp bsm" onclick="calAdd()">+ Add Post</button></div>'+
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><button class="btn bg bsm" onclick="calNav(-1)">&#8592;</button><span style="font-size:15px;font-weight:600;min-width:160px;text-align:center">'+MN[_cm]+' '+_cy+'</span><button class="btn bg bsm" onclick="calNav(1)">&#8594;</button>'+
  '<div style="margin-left:auto;display:flex;gap:12px">'+[['pending_approval','var(--amb)'],['approved','var(--grn)'],['published','var(--blu)']].map(function(s){return '<span style="font-size:11px;color:'+s[1]+';display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:'+s[1]+';display:inline-block"></span>'+s[0]+'</span>';}).join('')+'</div></div>'+
  '<div class="card" style="padding:14px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return '<div style="text-align:center;font-size:10px;color:var(--t2);font-weight:600;padding:5px 0">'+d+'</div>';}).join('')+'</div>'+
  '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">'+cells+'</div></div>'+
  '<div class="card" style="margin-top:12px"><div class="clbl">Upcoming Posts</div><table class="dt"><thead><tr><th>Date</th><th>Platform</th><th>Content</th><th>Status</th><th></th></tr></thead><tbody>'+
  bp.filter(function(p){return p.scheduled_at;}).sort(function(a,b){return (a.scheduled_at||'').localeCompare(b.scheduled_at||'');}).slice(0,15).map(function(p){
    return '<tr><td style="white-space:nowrap;color:var(--t2)">'+fD(p.scheduled_at)+'</td><td>'+pb(p.platform)+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+ec((p.content||'').slice(0,55))+'</td>'+
    stBdgHtml(p.status)+'</td>'+'<td><button class="btn bg bsm" onclick="viewPost(\''+ec(p.id)+'\')" >View</button></td></tr>';
  }).join('')+'</tbody></table></div>';
}
function calNav(d){_cm+=d;if(_cm>11){_cm=0;_cy++;}else if(_cm<0){_cm=11;_cy--;}go('calendar');}
function calDay(el){calAdd(el.getAttribute('data-date'));}
function calAdd(ds){
  showModal('<div class="mt"><span>Add Post to Calendar</span><button class="btn bg bsm" onclick="closeModal()">X</button></div>'+
  '<div style="display:flex;flex-direction:column;gap:10px"><div><label class="lbl">Platform</label><select class="sel" id="cal-pl">'+PL.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('')+'</select></div>'+
  '<div class="g2" style="gap:8px"><div><label class="lbl">Date</label><input class="inp" type="date" id="cal-d" value="'+(ds||td())+'"></div><div><label class="lbl">Time</label><input class="inp" type="time" id="cal-t" value="09:00"></div></div>'+
  '<div><label class="lbl">Content</label><textarea class="ta" id="cal-txt" rows="5" placeholder="Write your post content..."></textarea></div>'+
  '<button class="btn bp bfw" onclick="calSave()">Add to Calendar</button></div>');
  window.calSave=async function(){var pl=document.getElementById('cal-pl').value,d2=document.getElementById('cal-d').value,t2=document.getElementById('cal-t').value,txt=document.getElementById('cal-txt').value;if(!txt||!d2){alert('Fill date and content.');return;}var b=S.cur;var post={id:'m-'+Date.now(),brand_id:b?b.id:'demo',platform:pl,content:txt,hashtags:[],image_url:'',scheduled_at:d2+'T'+t2+':00',status:'approved',generated_by:'manual',author:'Manual',created_at:new Date().toISOString()};if(!S.demo&&SB){var {data}=await SB.from('posts').insert({...post,id:undefined}).select();if(data&&data[0])post=data[0];}S.posts.push(post);closeModal();go('calendar');};
}

<script>
// ANALYTICS
function vAnalytics(){
  var b=S.cur;var bp=S.posts.filter(function(p){return (!b||p.brand_id===b.id)&&p.status==='published';});
  var reach=bp.reduce(function(a,p){return a+(p.reach||0);},0);
  var likes=bp.reduce(function(a,p){return a+(p.likes||0);},0);
  var eng=bp.length?(bp.reduce(function(a,p){return a+(parseFloat(p.engagement_rate)||0);},0)/bp.length).toFixed(1):0;
  return '<div style="margin-bottom:24px"><div class="pg-title">Analytics</div><div class="pg-sub">Performance for '+(b?ec(b.name):'all brands')+'</div></div>'+
  '<div class="g4" style="margin-bottom:18px"><div class="stat"><div class="clbl">Total Reach</div><div style="font-size:26px;font-weight:600">'+fN(reach)+'</div></div><div class="stat"><div class="clbl">Total Likes</div><div style="font-size:26px;font-weight:600;color:var(--red)">'+fN(likes)+'</div></div><div class="stat"><div class="clbl">Avg Engagement</div><div style="font-size:26px;font-weight:600;color:var(--grn)">'+eng+'%</div></div><div class="stat"><div class="clbl">Posts Published</div><div style="font-size:26px;font-weight:600;color:var(--acc2)">'+bp.length+'</div></div></div>'+
  '<div class="g2" style="margin-bottom:14px"><div class="card"><div class="clbl">Engagement by Platform</div><div style="height:200px"><canvas id="ch-eng"></canvas></div></div>'+
  '<div class="card"><div class="clbl">Top Posts</div>'+(bp.length?bp.sort(function(a,b){return (parseFloat(b.engagement_rate)||0)-(parseFloat(a.engagement_rate)||0);}).slice(0,5).map(function(p){return '<div style="padding:9px 0;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px">'+pb(p.platform)+'<div style="flex:1;min-width:0"><div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+ec((p.content||'').slice(0,50))+'</div><div style="font-size:10px;color:var(--t2)">Reach: '+fN(p.reach)+'</div></div><span style="font-size:13px;font-weight:600;color:var(--grn)">'+(p.engagement_rate||0)+'%</span></div>';}).join(''):'<div class="empty" style="min-height:80px"><div>Publish posts to see analytics</div></div>')+'</div></div>';
}
function iAna(){
  var c=document.getElementById('ch-eng');if(!c)return;
  var b=S.cur;var pub=S.posts.filter(function(p){return (!b||p.brand_id===b.id)&&p.status==='published';});
  var byPl={};pub.forEach(function(p){if(!byPl[p.platform])byPl[p.platform]={n:0,e:0};byPl[p.platform].n++;byPl[p.platform].e+=(parseFloat(p.engagement_rate)||0);});
  var lbs=Object.keys(byPl),data=lbs.map(function(l){return byPl[l].n?(byPl[l].e/byPl[l].n).toFixed(1):0;});
  var cols=lbs.map(function(l){return PCOL[l]||'#8B5CF6';});
  if(!lbs.length){lbs=['No data'];data=[0];cols=['#2A2A40'];}
  S.charts.eng=new Chart(c,{type:'bar',data:{labels:lbs,datasets:[{data:data,backgroundColor:cols,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8080A0',font:{size:11}},grid:{display:false}},y:{ticks:{color:'#8080A0',font:{size:11},callback:function(v){return v+'%';}},grid:{color:'rgba(255,255,255,.04)'}}}}});
}

function saveApiKeys(){
  var fields={
    'am_sb_url':      'ak-sb-url',
    'am_sb_key':      'ak-sb-key',
    'am_sb_svc':      'ak-sb-svc',
    'am_ant_key':     'ak-ant',
    'am_openai_key':  'ak-openai',
    'am_apify_key':   'ak-apify',
    'am_serpapi_key': 'ak-serpapi',
    'am_serp_key':    'ak-serp',
    'am_tg_token':    'ak-tg-token',
    'am_tg_chat':     'ak-tg-chat',
    'am_wa_token':    'ak-wa-token',
    'am_wa_phone':    'ak-wa-phone',
    'am_li_id':       'ak-li-id',
    'am_li_secret':   'ak-li-secret',
    'am_fb_token':    'ak-fb-token',
    'am_fb_page':     'ak-fb-page',
    'am_ig_acct':     'ak-ig-acct',
    'am_buf_token':   'ak-buf-token',
    'am_buf_twit':    'ak-buf-twit',
    'am_gmail_user':  'ak-gmail-user',
    'am_gmail_pass':  'ak-gmail-pass'
  };
  Object.keys(fields).forEach(function(storageKey){
    var el=document.getElementById(fields[storageKey]);
    if(el){var val=el.value.trim();if(val)localStorage.setItem(storageKey,val);else localStorage.removeItem(storageKey);}
  });
  // Update CFG live
  CFG.sbUrl=localStorage.getItem('am_sb_url')||'';
  CFG.sbKey=localStorage.getItem('am_sb_key')||'';
  CFG.antKey=localStorage.getItem('am_ant_key')||'';
  CFG.serpKey=localStorage.getItem('am_serp_key')||'';
  if(CFG.sbUrl&&CFG.sbKey)SB=window.supabase.createClient(CFG.sbUrl,CFG.sbKey);
  // Show saved confirmation
  var btn=event.target;var orig=btn.textContent;var origCls=btn.className;
  btn.textContent='✓ All Keys Saved';btn.className='btn bs';btn.style.flex='1';btn.style.padding='12px';btn.style.fontSize='13px';

<script>
// ═══════════════════════════════════════════════════════
// SEO BLOG — EDIT, DOWNLOAD AS WORD & PDF
// ═══════════════════════════════════════════════════════

// Override seoShowResult to include editing + Word/PDF download
var _origSeoShowResult = seoShowResult;
seoShowResult = function(r){
  var wrap = document.getElementById('seo-wrap');
  if(!wrap)return;
  var wc = (r.content||'').split(/\s+/).length;

  wrap.innerHTML =
  '<div class="al al-g" style="margin-bottom:14px">✓ Blog post ready — '+wc+' words — <b>'+ec(r.title||'')+'</b></div>'+

  // Stats
  '<div class="g4" style="margin-bottom:14px">'+
  '<div class="stat"><div class="clbl">Word Count</div><div style="font-size:22px;font-weight:600;color:var(--acc2)">'+wc+'</div></div>'+
  '<div class="stat"><div class="clbl">Primary Keyword</div><div style="font-size:12px;font-weight:600;margin-top:4px">'+ec(r.primaryKeyword||'')+'</div></div>'+
  '<div class="stat"><div class="clbl">Keywords Found</div><div style="font-size:22px;font-weight:600;color:var(--grn2)">'+(r.keywords||[]).length+'</div></div>'+
  '<div class="stat"><div class="clbl">Business</div><div style="font-size:12px;font-weight:600;margin-top:4px">'+ec(r.businessName||'')+'</div></div>'+
  '</div>'+

  // Tabs: Preview / Edit
  '<div class="tabs" style="max-width:320px">'+
  '<button class="tab on" id="tab-preview" onclick="seoTabSwitch(\'preview\',this)">Preview</button>'+
  '<button class="tab" id="tab-edit" onclick="seoTabSwitch(\'edit\',this)">Edit</button>'+
  '</div>'+

  // Action buttons
  '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'+
  '<button class="btn bp" onclick="seoCopy()">Copy Text</button>'+
  '<button class="btn ba" onclick="seoDownloadWord()">Download Word (.doc)</button>'+
  '<button class="btn ba" onclick="seoDownloadPDF()">Download / Print PDF</button>'+
  '<button class="btn bg" onclick="seoDownload()">Download .txt</button>'+
  '<button class="btn bg" onclick="go(\'seoblog\')">Write Another</button>'+
  '</div>'+

  // Keywords
  ((r.keywords||[]).length?
  '<div class="card" style="margin-bottom:14px"><div class="clbl">Top 10 SEO Keywords</div>'+
  '<div style="display:flex;flex-wrap:wrap;gap:6px">'+
  (r.keywords||[]).map(function(k){
    var col=k.difficulty==='low'?'var(--grn2)':k.difficulty==='medium'?'var(--amb2)':'var(--red2)';
    return '<div style="padding:5px 10px;background:var(--c2);border:1px solid var(--b1);border-radius:7px;font-size:11px">'+
    '<div style="font-weight:600">'+ec(k.keyword||'')+'</div>'+
    '<div style="color:'+col+';font-size:10px">'+ec(k.intent||'')+' · '+ec(k.difficulty||'')+'</div></div>';
  }).join('')+
  '</div></div>':'') +

  // Preview panel
  '<div id="seo-panel-preview" class="card">'+
  '<div style="font-size:13px;line-height:1.85;white-space:pre-wrap;max-height:650px;overflow-y:auto;background:var(--c2);padding:16px;border-radius:8px;border:1px solid var(--b1)" id="seo-content">'+ec(r.content||'')+'</div>'+
  '</div>'+

  // Edit panel (hidden by default)
  '<div id="seo-panel-edit" class="card" style="display:none">'+
  '<div style="font-size:12px;color:var(--t2);margin-bottom:10px">Edit your blog post directly. Changes save automatically when you download or copy.</div>'+
  '<textarea class="ta" id="seo-editor" rows="30" style="font-size:13px;line-height:1.8;font-family:inherit">'+ec(r.content||'')+'</textarea>'+
  '<div style="display:flex;gap:8px;margin-top:10px">'+
  '<button class="btn bs" onclick="seoSaveEdit()">✓ Save Edits</button>'+
  '<button class="btn bg bsm" onclick="seoRevertEdit()">Revert to Original</button>'+
  '</div></div>';

  SEO_STATE.result = r;
  SEO_STATE.originalContent = r.content;
};

function seoTabSwitch(tab, btn){
  document.querySelectorAll('.tabs .tab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.getElementById('seo-panel-preview').style.display = tab==='preview'?'block':'none';
  document.getElementById('seo-panel-edit').style.display = tab==='edit'?'block':'none';
  if(tab==='edit'){
    var ed = document.getElementById('seo-editor');
    if(ed && SEO_STATE.result) ed.value = SEO_STATE.result.content;
  }
}

function seoSaveEdit(){
  var ed = document.getElementById('seo-editor');
  if(!ed||!SEO_STATE.result)return;
  SEO_STATE.result.content = ed.value;
  SEO_STATE.result.wordCount = ed.value.split(/\s+/).length;
  // Update preview
  var prev = document.getElementById('seo-content');
  if(prev) prev.textContent = ed.value;
  // Save to history
  var idx = SEO_STATE.history.findIndex(function(h){return h.id===SEO_STATE.result.id;});
  if(idx>=0) SEO_STATE.history[idx] = SEO_STATE.result;
  localStorage.setItem('seo_blog_history', JSON.stringify(SEO_STATE.history));
  var btn = event.target;
  btn.textContent='✓ Saved!';btn.className='btn bs';
  setTimeout(function(){btn.textContent='✓ Save Edits';btn.className='btn bs';},1800);
}

function seoRevertEdit(){
  if(!SEO_STATE.originalContent)return;
  if(!confirm('Revert to the original AI-generated version? Your edits will be lost.'))return;
  var ed = document.getElementById('seo-editor');
  if(ed) ed.value = SEO_STATE.originalContent;
  SEO_STATE.result.content = SEO_STATE.originalContent;
}

function seoCopy(){
  if(!SEO_STATE.result)return;
  var content = SEO_STATE.result.content;
  // Get edited version if in edit mode
  var ed = document.getElementById('seo-editor');
  if(ed && document.getElementById('seo-panel-edit') && document.getElementById('seo-panel-edit').style.display!=='none'){
    content = ed.value;
  }
  navigator.clipboard.writeText(content).then(function(){
    var btn=event.target;var orig=btn.textContent;btn.textContent='✓ Copied!';btn.className='btn bs';
    setTimeout(function(){btn.textContent=orig;btn.className='btn bp';},2000);
  }).catch(function(){alert('Copy failed — select text manually from the preview box.');});
}

function seoDownload(){
  if(!SEO_STATE.result)return;
  var c = SEO_STATE.result.content;
  var ed = document.getElementById('seo-editor');
  if(ed && document.getElementById('seo-panel-edit') && document.getElementById('seo-panel-edit').style.display!=='none') c = ed.value;
  var blob = new Blob([c], {type:'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'SEO-Blog-'+( SEO_STATE.result.businessName||'post').replace(/\s+/g,'-')+'-'+new Date().toISOString().split('T')[0]+'.txt';
  a.click();
}

function seoDownloadWord(){
  if(!SEO_STATE.result)return;
  var c = SEO_STATE.result.content;
  var ed = document.getElementById('seo-editor');
  if(ed && document.getElementById('seo-panel-edit') && document.getElementById('seo-panel-edit').style.display!=='none') c = ed.value;

  // Convert markdown-style text to basic HTML for Word
  var lines = c.split('\n');
  var htmlLines = lines.map(function(line){
    var l = line.trim();
    if(!l) return '<p style="margin:8px 0">&nbsp;</p>';
    if(l.startsWith('# ')) return '<h1 style="font-size:22pt;font-weight:bold;margin:14px 0 8px;color:#1a1a2e">'+l.slice(2)+'</h1>';
    if(l.startsWith('## ')) return '<h2 style="font-size:16pt;font-weight:bold;margin:12px 0 6px;color:#2c2c54">'+l.slice(3)+'</h2>';
    if(l.startsWith('### ')) return '<h3 style="font-size:13pt;font-weight:bold;margin:10px 0 4px">'+l.slice(4)+'</h3>';
    if(l.startsWith('**') && l.endsWith('**')) return '<p style="font-weight:bold;margin:6px 0">'+l.slice(2,-2)+'</p>';
    if(l.startsWith('- ') || l.startsWith('• ')) return '<li style="margin:4px 0;margin-left:20px">'+l.slice(2)+'</li>';
    if(/^\d+\.\s/.test(l)) return '<li style="margin:4px 0;margin-left:20px">'+l.replace(/^\d+\.\s/,'')+'</li>';
    // Bold inline: **text**
    l = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return '<p style="margin:6px 0;line-height:1.7">'+l+'</p>';
  });

  var title = SEO_STATE.result.title || 'SEO Blog Post';
  var biz = SEO_STATE.result.businessName || '';
  var kw = SEO_STATE.result.primaryKeyword || '';
  var date = new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});

  var wordHtml = '<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>'+title+'</title>'+
  '<xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml>'+
  '<style>'+
  'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#1a1a1a;max-width:720px;margin:0 auto;padding:40px;}'+
  'h1{font-size:22pt;color:#1a1a2e;margin:16px 0 8px;}'+
  'h2{font-size:15pt;color:#2c2c54;margin:14px 0 6px;border-bottom:1px solid #e0e0e0;padding-bottom:4px;}'+
  'h3{font-size:12pt;color:#333;margin:10px 0 4px;}'+
  'p{line-height:1.7;margin:7px 0;}'+
  'li{line-height:1.7;margin:4px 0;}'+
  '.meta{background:#f5f5f5;padding:12px 16px;border-left:4px solid #6c5ce7;margin-bottom:20px;font-size:10pt;color:#555;}'+
  '</style></head><body>'+
  '<div class="meta"><b>Business:</b> '+biz+' &nbsp;|&nbsp; <b>Primary Keyword:</b> '+kw+' &nbsp;|&nbsp; <b>Generated:</b> '+date+'</div>'+
  htmlLines.join('\n')+
  '</body></html>';

  var blob = new Blob(['\ufeff'+wordHtml], {type:'application/msword'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'SEO-Blog-'+(SEO_STATE.result.businessName||'post').replace(/\s+/g,'-')+'-'+new Date().toISOString().split('T')[0]+'.doc';
  a.click();
}

function seoDownloadPDF(){
  if(!SEO_STATE.result)return;
  var c = SEO_STATE.result.content;
  var ed = document.getElementById('seo-editor');
  if(ed && document.getElementById('seo-panel-edit') && document.getElementById('seo-panel-edit').style.display!=='none') c = ed.value;

  var title = SEO_STATE.result.title || 'SEO Blog Post';
  var biz = SEO_STATE.result.businessName || '';
  var kw = SEO_STATE.result.primaryKeyword || '';
  var date = new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});

  var lines = c.split('\n');
  var htmlLines = lines.map(function(line){
    var l = line.trim();
    if(!l) return '<br>';
    if(l.startsWith('# ')) return '<h1>'+l.slice(2)+'</h1>';
    if(l.startsWith('## ')) return '<h2>'+l.slice(3)+'</h2>';
    if(l.startsWith('### ')) return '<h3>'+l.slice(4)+'</h3>';
    if(l.startsWith('- ')||l.startsWith('• ')) return '<li>'+l.slice(2)+'</li>';
    l = l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    return '<p>'+l+'</p>';
  });

  var win = window.open('','_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+title+'</title>'+
  '<style>'+
  '@page{size:A4;margin:2cm;}'+
  'body{font-family:Georgia,serif;font-size:11pt;color:#1a1a1a;line-height:1.7;max-width:680px;margin:0 auto;}'+
  'h1{font-size:20pt;color:#1a1a2e;margin:14px 0 8px;line-height:1.3;}'+
  'h2{font-size:14pt;color:#2c2c54;margin:16px 0 6px;border-bottom:1px solid #ddd;padding-bottom:4px;}'+
  'h3{font-size:12pt;font-weight:bold;margin:12px 0 4px;}'+
  'p{margin:6px 0;}li{margin:3px 0;}'+
  '.header{background:#f7f7fb;border-left:4px solid #6c5ce7;padding:10px 14px;margin-bottom:18px;font-size:9pt;color:#666;}'+
  '.footer{text-align:center;font-size:8pt;color:#999;margin-top:24px;border-top:1px solid #eee;padding-top:8px;}'+
  '@media print{.no-print{display:none!important}body{margin:0}}'+
  '</style></head><body>'+
  '<div class="no-print" style="background:#e8e8f8;padding:10px 16px;margin-bottom:16px;border-radius:6px;font-family:sans-serif;font-size:12px">'+
  '<b>To save as PDF:</b> Press Ctrl+P (or Cmd+P on Mac) → Change destination to "Save as PDF" → Save &nbsp;'+
  '<button onclick="window.print()" style="background:#6c5ce7;color:#fff;border:none;padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px">Print / Save PDF</button></div>'+
  '<div class="header"><b>'+biz+'</b> &nbsp;·&nbsp; Keyword: <b>'+kw+'</b> &nbsp;·&nbsp; Generated: '+date+'</div>'+
  htmlLines.join('\n')+
  '<div class="footer">Generated by AutoMarketer AI · '+date+'</div>'+
  '</body></html>');
  win.document.close();
  setTimeout(function(){win.focus();},300);
}
</script>
<script>
// ═══════════════════════════════════════════════════════
// SEO BLOG WRITER AGENT — full page + pipeline
// ═══════════════════════════════════════════════════════

var SEO_STATE = {
  running: false, result: null, originalContent: null,
  history: JSON.parse(localStorage.getItem('seo_blog_history')||'[]')
};

var SEO_STEPS = [
  {id:'crawl',    label:'Website Analysis',       desc:'Reading your website — products, services, tone'},
  {id:'research', label:'Competitor Research',     desc:'Analysing what competitors rank for'},
  {id:'keywords', label:'Keyword Research',        desc:'Finding top 10 SEO keywords for your business'},
  {id:'outline',  label:'Blog Outline',            desc:'Creating H2 structure, FAQ, TL;DR'},
  {id:'write',    label:'Writing Full Blog Post',  desc:'Writing a 1500+ word SEO article'},
  {id:'optimise', label:'SEO / AEO / GEO Polish',  desc:'Snippets, metadata, schema'},
  {id:'humanise', label:'Humanising Content',      desc:'Removing AI patterns — sounding human'},
  {id:'done',     label:'Complete',                desc:'Ready to publish'}
];

function vSEOBlog(){
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px">'+
  '<div><div class="pg-title">SEO Blog Writer Agent</div>'+
  '<div class="pg-sub">AI pipeline: Brief → Keyword Research → Full Blog Post → SEO Optimised → Humanised</div></div>'+
  '<button class="btn bg bsm" onclick="seoShowHistory()">History ('+SEO_STATE.history.length+')</button></div>'+
  '<div id="seo-wrap">'+seoFormHtml()+'</div>';
}

function seoFormHtml(){
  return '<div style="display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start">'+
  '<div class="card"><div class="clbl">Business Brief</div>'+
  '<div style="display:flex;flex-direction:column;gap:11px">'+
  '<div class="g2" style="gap:9px"><div><label class="lbl">Business Name *</label><input class="inp" id="seo-name" placeholder="e.g. Brexy"></div>'+
  '<div><label class="lbl">Website URL *</label><input class="inp" id="seo-url" placeholder="https://yoursite.com"></div></div>'+
  '<div class="g2" style="gap:9px"><div><label class="lbl">Industry / Niche *</label><input class="inp" id="seo-niche" placeholder="e.g. AI Finance"></div>'+
  '<div><label class="lbl">Business Type *</label><select class="sel" id="seo-btype"><option>B2B (Business to Business)</option><option>B2C (Business to Consumer)</option><option>Both B2B and B2C</option><option>D2C (Direct to Consumer)</option></select></div></div>'+
  '<div><label class="lbl">Products / Services *</label><textarea class="ta" id="seo-services" rows="2" placeholder="Describe your main products or services..."></textarea></div>'+
  '<div><label class="lbl">Target Audience *</label><textarea class="ta" id="seo-audience" rows="2" placeholder="e.g. Investment bankers aged 30-50 looking for AI tools"></textarea></div>'+
  '<div><label class="lbl">Top 3 Competitors *</label><textarea class="ta" id="seo-competitors" rows="2" placeholder="e.g. rogo.ai, hebbia.com, v7labs.com"></textarea></div>'+
  '<div class="g2" style="gap:9px"><div><label class="lbl">Geographic Focus *</label><select class="sel" id="seo-geo"><option>International or Global</option><option>National</option><option>Local (City or Region)</option></select></div>'+
  '<div><label class="lbl">City / Region (if local)</label><input class="inp" id="seo-city" placeholder="e.g. Delhi, Singapore"></div></div>'+
  '<div class="g2" style="gap:9px"><div><label class="lbl">Brand Tone *</label><select class="sel" id="seo-tone"><option>Professional and Formal</option><option>Friendly and Conversational</option><option>Expert and Technical</option><option>Bold and Authoritative</option><option>Casual and Fun</option></select></div>'+
  '<div><label class="lbl">Target Keywords (optional)</label><input class="inp" id="seo-keywords" placeholder="e.g. investment banking AI"></div></div>'+
  '<div><label class="lbl">What Makes You Different (USP) *</label><textarea class="ta" id="seo-usp" rows="2" placeholder="What sets you apart from competitors?"></textarea></div>'+
  '<div><label class="lbl">Blog Topic (blank = AI picks best topic)</label><input class="inp" id="seo-topic" placeholder="e.g. How AI is changing investment banking in 2025"></div>'+
  '<button class="btn bp bfw" onclick="runSEOBlog()" id="seo-run-btn" style="padding:12px;font-size:13px">✍ Generate SEO Blog Post</button>'+
  '</div></div>'+
  '<div style="display:flex;flex-direction:column;gap:10px">'+
  '<div class="card"><div class="clbl">AI Pipeline — 7 Steps</div>'+
  SEO_STEPS.map(function(s,i){
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--b1)" id="seo-step-'+s.id+'">'+
    '<div style="width:28px;height:28px;border-radius:50%;background:var(--c3);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);flex-shrink:0" id="seo-dot-'+s.id+'">'+(i+1)+'</div>'+
    '<div><div style="font-size:12px;color:var(--t2)">'+s.label+'</div><div style="font-size:10px;color:var(--t3)">'+s.desc+'</div></div></div>';
  }).join('')+'</div>'+
  '<div class="card" style="background:var(--c2)"><div class="clbl">Output Includes</div>'+
  '<div style="font-size:12px;color:var(--t2);line-height:1.85">'+
  '✓ 1,500–2,500 word blog post<br>✓ H1 / H2 / H3 structure<br>✓ TL;DR at the top<br>'+
  '✓ Featured snippet answer<br>✓ 5-question FAQ section<br>✓ 100% human-sounding<br>'+
  '✓ SEO metadata (title, desc, slug)<br>✓ Copy / Edit / Word / PDF download'+
  '</div></div>'+
  '<div class="card" style="background:var(--c2)"><div class="clbl">Keys Needed</div>'+
  '<div style="font-size:12px;line-height:1.85">'+
  (CFG.antKey?'<span style="color:var(--grn2)">✓</span>':'<span style="color:var(--red2)">✗</span>')+' Anthropic API Key<br>'+
  (localStorage.getItem('am_serp_key')?'<span style="color:var(--grn2)">✓</span>':'<span style="color:var(--t3)">○</span>')+' <span style="color:var(--t2)">Serper.dev (optional)</span><br>'+
  '<span style="color:var(--grn2)">✓</span> <span style="color:var(--t2)">Jina AI — free, no key needed</span>'+
  '</div></div></div></div>';
}

function seoSetStep(id,st,det){
  var dot=document.getElementById('seo-dot-'+id);
  var row=document.getElementById('seo-step-'+id);
  if(!dot||!row)return;
  var bg={wait:'var(--c3)',run:'var(--acc-bg)',done:'var(--grn-bg)',err:'var(--red-bg)'};
  var tc={wait:'var(--t3)',run:'var(--acc2)',done:'var(--grn2)',err:'var(--red2)'};
  dot.style.background=bg[st]||bg.wait;dot.style.color=tc[st]||tc.wait;
  if(st==='run')dot.innerHTML='<span class="spin" style="font-size:10px">⟳</span>';
  else if(st==='done')dot.innerHTML='✓';
  else if(st==='err')dot.innerHTML='✗';
  if(det){
    var ex=row.querySelector('.seo-det');
    if(!ex){ex=document.createElement('div');ex.className='seo-det';ex.style.cssText='font-size:10px;color:var(--grn2);margin-top:2px';row.querySelector('div:last-child').appendChild(ex);}
    ex.textContent=det;
  }
}

async function runSEOBlog(){
  if(!CFG.antKey){alert('Add your Anthropic API key in Settings → API Keys first.');go('apikeys');return;}
  var btn=document.getElementById('seo-run-btn');
  btn.disabled=true;btn.textContent='⟳ Generating...';
  var inp={

  };
  if(!inp.name||!inp.niche||!inp.services){alert('Fill in Business Name, Industry and Services.');btn.disabled=false;btn.textContent='✍ Generate SEO Blog Post';return;}
  var profile='Business: '+inp.name+'\nWebsite: '+inp.url+'\nNiche: '+inp.niche+'\nType: '+inp.btype+'\nServices: '+inp.services+'\nAudience: '+inp.audience+'\nCompetitors: '+inp.competitors+'\nGeo: '+inp.geo+(inp.city?' — '+inp.city:'')+'\nTone: '+inp.tone+'\nKeywords: '+inp.keywords+'\nUSP: '+inp.usp+'\nTopic: '+inp.topic;
  try{
    seoSetStep('crawl','run');
    var webCtx='';
    if(inp.url){try{var wr=await fetch('https://r.jina.ai/'+inp.url,{headers:{'Accept':'text/plain'}});webCtx=(await wr.text()).slice(0,3000);seoSetStep('crawl','done','Read '+webCtx.length+' chars from website');}catch(e){webCtx='Brand: '+inp.name+'. '+inp.services;seoSetStep('crawl','done','Used manual details');}}
    else{webCtx='Business: '+inp.name+'. '+inp.services;seoSetStep('crawl','done','No URL — using manual details');}
    seoSetStep('research','run');
    var serpKey=localStorage.getItem('am_serp_key');
    var compData='Competitors listed: '+inp.competitors;
    if(serpKey){try{var sr=await fetch('https://google.serper.dev/search',{method:'POST',headers:{'X-API-KEY':serpKey,'Content-Type':'application/json'},body:JSON.stringify({q:inp.niche+' top blog articles',num:5})});var sd=await sr.json();compData=(sd.organic||[]).slice(0,5).map(function(r){return r.title+': '+r.snippet;}).join('\n');seoSetStep('research','done','Found '+(sd.organic||[]).length+' competitor articles');}catch(e){seoSetStep('research','done','Used manual competitor list');}}
    else{seoSetStep('research','done','No Serper key — used manual data');}
    seoSetStep('keywords','run');
    var kwRes=await ai('Senior SEO keyword researcher.\n\nBusiness:\n'+profile+'\n\nWebsite:\n'+webCtx.slice(0,400)+'\n\nCompetitors:\n'+compData+'\n\nFind BEST 10 keywords. Return ONLY valid JSON:\n{"top10Keywords":[{"keyword":"","intent":"","difficulty":"low|medium|high","reason":""}],"recommendedPrimaryKeyword":"","clusterGroups":{"group1":[],"group2":[]}}','Return only valid JSON. No backticks.',1200);
    var kwData;try{kwData=JSON.parse(kwRes.replace(/```json|```/g,'').trim());}catch(e){kwData={recommendedPrimaryKeyword:inp.niche,top10Keywords:[]};}
    var primaryKw=kwData.recommendedPrimaryKeyword||inp.niche;
    seoSetStep('keywords','done','Primary: '+primaryKw);
    seoSetStep('outline','run');
    var outRes=await ai('SEO blog outline architect.\n\nKeyword: '+primaryKw+'\nProfile:\n'+profile+'\n\nCreate outline. Return ONLY valid JSON:\n{"title":"","metaDescription":"","introduction":"","h2Sections":[{"heading":"","subPoints":[""]}],"faqSection":[{"question":"","answer":""}],"conclusion":"","estimatedWordCount":0}','Return only valid JSON.',1200);
    var outData;try{outData=JSON.parse(outRes.replace(/```json|```/g,'').trim());}catch(e){outData={title:'The Complete Guide to '+primaryKw,h2Sections:[],faqSection:[]};}
    seoSetStep('outline','done',outData.title||'Outline ready');
    seoSetStep('write','run');
    var draft=await ai('Professional SEO blog writer.\n\nTitle: '+outData.title+'\nOutline: '+JSON.stringify(outData).slice(0,600)+'\nProfile:\n'+profile+'\nKeyword: '+primaryKw+'\n\nWrite a complete 1500-2000 word SEO blog post. Use the H2 sections. Write like a human expert. No AI filler.','Write the full blog post. Be specific and expert.',3000);
    seoSetStep('write','done',draft.length+' characters written');
    seoSetStep('optimise','run');
    var opt=await ai('Elite SEO editor and AEO/GEO specialist.\n\nPost:\n'+draft.slice(0,2500)+'\n\nKeyword: '+primaryKw+'\nBusiness: '+inp.name+'\n\nOptimize:\n1. Add TL;DR at very start (2-3 sentences)\n2. Add featured snippet answer after first H2\n3. Improve or add FAQ (5 questions)\n4. End with SEO METADATA:\n   - Title Tag (60 chars)\n   - Meta Description (155 chars)\n   - URL Slug\n   - Focus Keyword\n   - Secondary Keywords\n   - Schema Type\n\nReturn complete optimized post.','Improve with SEO best practices.',3000);
    seoSetStep('optimise','done','TL;DR, snippets, metadata added');
    seoSetStep('humanise','run');
    var final=await ai('Content humanizer.\n\nPost:\n'+opt.slice(0,2500)+'\n\nRules:\n1. Vary sentence length\n2. Add transitions: "Here\'s the thing", "In reality"\n3. Remove: "In conclusion", "It is important to note"\n4. Add rhetorical questions\n5. Use contractions\n6. Keep all SEO keywords\n7. Keep all headings\n8. Output full rewritten post only','Make it 100% human. Never change SEO keywords.',3000);
    seoSetStep('humanise','done','Content humanized');
    seoSetStep('done','done','Ready to publish');
    var r={id:Date.now(),date:new Date().toISOString(),businessName:inp.name,primaryKeyword:primaryKw,title:outData.title||'SEO Blog Post',keywords:kwData.top10Keywords||[],content:final,wordCount:final.split(/\s+/).length};
    SEO_STATE.result=r;SEO_STATE.originalContent=final;
    SEO_STATE.history.unshift(r);if(SEO_STATE.history.length>20)SEO_STATE.history=SEO_STATE.history.slice(0,20);
    localStorage.setItem('seo_blog_history',JSON.stringify(SEO_STATE.history));
    seoRenderResult(r);
  }catch(e){
    seoSetStep('crawl','err','Error: '+e.message);
    var errDiv=document.getElementById('seo-wrap');
    if(errDiv)errDiv.insertAdjacentHTML('beforeend','<div class="al al-r" style="margin-top:14px">Error: '+ec(e.message)+'</div>');
  }
  btn.disabled=false;btn.textContent='✍ Generate SEO Blog Post';
}

  '</div>'+
  ((r.keywords||[]).length?'<div class="card" style="margin-bottom:14px"><div class="clbl">Top Keywords Found</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+
  (r.keywords||[]).map(function(k){var col=k.difficulty==='low'?'var(--grn2)':k.difficulty==='medium'?'var(--amb2)':'var(--red2)';return '<div style="padding:5px 10px;background:var(--c2);border:1px solid var(--b1);border-radius:7px;font-size:11px"><div style="font-weight:600">'+ec(k.keyword||'')+'</div><div style="color:'+col+';font-size:10px">'+ec(k.intent||'')+' · '+ec(k.difficulty||'')+'</div></div>';}).join('')+'</div></div>':'')+
  '<div id="seo-prev" class="card"><div style="font-size:13px;line-height:1.85;white-space:pre-wrap;max-height:600px;overflow-y:auto;background:var(--c2);padding:16px;border-radius:8px;border:1px solid var(--b1)">'+ec(r.content||'')+'</div></div>'+

  '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn bs" onclick="seoSave()">✓ Save Edits</button><button class="btn bg bsm" onclick="seoRevert()">Revert to Original</button></div></div>';
  SEO_STATE.result=r;
}
function seoTab(t,btn){document.querySelectorAll('.tabs .tab').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');document.getElementById('seo-prev').style.display=t==='prev'?'block':'none';document.getElementById('seo-edit').style.display=t==='edit'?'block':'none';if(t==='edit'){var ed=document.getElementById('seo-editor');if(ed&&SEO_STATE.result)ed.value=SEO_STATE.result.content;}}
function seoSave(){var ed=document.getElementById('seo-editor');if(!ed||!SEO_STATE.result)return;SEO_STATE.result.content=ed.value;SEO_STATE.result.wordCount=ed.value.split(/\s+/).length;var p=document.getElementById('seo-prev');if(p)p.querySelector('div').textContent=ed.value;var idx=SEO_STATE.history.findIndex(function(h){return h.id===SEO_STATE.result.id;});if(idx>=0)SEO_STATE.history[idx]=SEO_STATE.result;localStorage.setItem('seo_blog_history',JSON.stringify(SEO_STATE.history));var btn=event.target;btn.textContent='✓ Saved!';setTimeout(function(){btn.textContent='✓ Save Edits';},1800);}
function seoRevert(){if(!SEO_STATE.originalContent||!confirm('Revert to original? Edits will be lost.'))return;var ed=document.getElementById('seo-editor');if(ed)ed.value=SEO_STATE.originalContent;if(SEO_STATE.result)SEO_STATE.result.content=SEO_STATE.originalContent;}
function seoCopy(){if(!SEO_STATE.result)return;var c=SEO_STATE.result.content;var ed=document.getElementById('seo-editor');if(ed&&document.getElementById('seo-edit')&&document.getElementById('seo-edit').style.display!=='none')c=ed.value;navigator.clipboard.writeText(c).then(function(){var btn=event.target;var orig=btn.textContent;btn.textContent='✓ Copied!';btn.className='btn bs';setTimeout(function(){btn.textContent=orig;btn.className='btn bp';},2000);}).catch(function(){alert('Select text manually from the preview box.');});}
function seoTxt(){if(!SEO_STATE.result)return;var c=SEO_STATE.result.content;var blob=new Blob([c],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SEO-Blog-'+(SEO_STATE.result.businessName||'post').replace(/\s+/g,'-')+'.txt';a.click();}
function seoWord(){
  if(!SEO_STATE.result)return;
  var c=SEO_STATE.result.content;var ed=document.getElementById('seo-editor');
  if(ed&&document.getElementById('seo-edit')&&document.getElementById('seo-edit').style.display!=='none')c=ed.value;
  var lines=c.split('\n');
  var html=lines.map(function(l){l=l.trim();if(!l)return '<p>&nbsp;</p>';if(l.startsWith('# '))return '<h1>'+l.slice(2)+'</h1>';if(l.startsWith('## '))return '<h2>'+l.slice(3)+'</h2>';if(l.startsWith('### '))return '<h3>'+l.slice(4)+'</h3>';if(l.startsWith('- ')||l.startsWith('• '))return '<li>'+l.slice(2)+'</li>';l=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');return '<p>'+l+'</p>';}).join('\n');

  '<div class="meta"><b>'+(SEO_STATE.result.businessName||'')+'</b> · Keyword: <b>'+(SEO_STATE.result.primaryKeyword||'')+'</b> · '+new Date().toLocaleDateString('en-IN')+'</div>'+
  html+'</body></html>';
  var blob=new Blob(['\ufeff'+doc],{type:'application/msword'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SEO-Blog-'+(SEO_STATE.result.businessName||'post').replace(/\s+/g,'-')+'.doc';a.click();

function seoPDF(){
  if(!SEO_STATE.result)return;

  if(ed&&document.getElementById('seo-edit')&&document.getElementById('seo-edit').style.display!=='none')c=ed.value;

  var html=lines.map(function(l){l=l.trim();if(!l)return '<br>';if(l.startsWith('# '))return '<h1>'+l.slice(2)+'</h1>';if(l.startsWith('## '))return '<h2>'+l.slice(3)+'</h2>';if(l.startsWith('### '))return '<h3>'+l.slice(4)+'</h3>';if(l.startsWith('- ')||l.startsWith('• '))return '<li>'+l.slice(2)+'</li>';l=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');return '<p>'+l+'</p>';}).join('\n');
  var win=window.open('','_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+(SEO_STATE.result.title||'Blog')+'</title>'+
  '<style>@page{size:A4;margin:2cm}body{font-family:Georgia,serif;font-size:11pt;line-height:1.75;color:#1a1a1a;max-width:680px;margin:0 auto}h1{font-size:20pt;color:#1a1a2e;margin:12px 0 8px}h2{font-size:14pt;color:#2c2c54;margin:14px 0 6px;border-bottom:1px solid #ddd;padding-bottom:3px}h3{font-size:12pt;margin:10px 0 4px}p{margin:6px 0}li{margin:3px 0}.hdr{background:#f7f7fb;border-left:4px solid #6c5ce7;padding:10px 14px;margin-bottom:16px;font-size:9pt;color:#666}.ftr{text-align:center;font-size:8pt;color:#999;margin-top:20px;border-top:1px solid #eee;padding-top:8px}.bar{background:#e8e8f8;padding:10px 16px;margin-bottom:16px;border-radius:6px;font-family:sans-serif;font-size:12px}@media print{.bar{display:none}}</style></head><body>'+
  '<div class="bar"><b>To save as PDF:</b> Press Cmd+P (Mac) or Ctrl+P → Destination: Save as PDF <button onclick="window.print()" style="background:#6c5ce7;color:#fff;border:none;padding:4px 14px;border-radius:5px;cursor:pointer;margin-left:10px">Print / Save PDF</button></div>'+
  '<div class="hdr"><b>'+(SEO_STATE.result.businessName||'')+'</b> · '+( SEO_STATE.result.primaryKeyword||'')+' · '+new Date().toLocaleDateString('en-IN')+'</div>'+
  html+'<div class="ftr">Generated by AutoMarketer AI</div></body></html>');
  win.document.close();setTimeout(function(){win.focus();},300);

function seoShowHistory(){
  if(!SEO_STATE.history.length){alert('No blog posts yet.');return;}
  showModal('<div class="mt"><span>Blog History</span><button class="btn bg bsm" onclick="closeModal()">✕</button></div>'+
  '<div style="display:flex;flex-direction:column;gap:8px">'+
  SEO_STATE.history.map(function(r){
    return '<div class="card-sm" style="cursor:pointer" onclick="SEO_STATE.result=SEO_STATE.history.find(function(x){return x.id==='+r.id+'});seoRenderResult(SEO_STATE.result);closeModal()">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><div style="font-size:13px;font-weight:600">'+ec(r.title||'')+'</div><span class="bdg" style="background:var(--acc-bg);color:var(--acc2)">'+r.wordCount+' words</span></div>'+
    '<div style="font-size:11px;color:var(--t2)">'+ec(r.businessName||'')+' · '+ec(r.primaryKeyword||'')+' · '+new Date(r.date).toLocaleDateString('en-IN')+'</div></div>';
  }).join('')+'</div>');

<script>

  '<button class="btn bp" onclick="go(\'seoblog\')" style="margin-top:14px">Write First Blog Post</button>'+
  '</div></div>'
  );

function blogCard(r){
  var wc = r.wordCount || (r.content||'').split(/\s+/).length;
  var date = new Date(r.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  return '<div class="card" style="cursor:pointer;transition:border-color .15s" id="blog-'+r.id+'" onmouseenter="this.style.borderColor=\'var(--acc)\'" onmouseleave="this.style.borderColor=\'var(--b1)\'">'+

  '<div style="flex:1;min-width:0">'+

  '<div style="font-size:12px;color:var(--t2);margin-bottom:8px">'+ec(r.businessName||'')+' &nbsp;·&nbsp; Keyword: <b style="color:var(--t1)">'+ec(r.primaryKeyword||'')+'</b> &nbsp;·&nbsp; '+date+'</div>'+
  '<div style="font-size:12px;color:var(--t2);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+ec((r.content||'').slice(0,180))+'</div>'+
  '</div>'+
  '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0">'+
  '<span class="bdg" style="background:var(--acc-bg);color:var(--acc2)">'+wc+' words</span>'+
  '<div style="display:flex;gap:6px">'+
  '<button class="btn bp bsm" onclick="event.stopPropagation();openBlog('+r.id+')">Open</button>'+
  '<button class="btn bg bsm" onclick="event.stopPropagation();downloadBlogTxt('+r.id+')">↓ txt</button>'+
  '<button class="btn ba bsm" onclick="event.stopPropagation();downloadBlogWord('+r.id+')">↓ doc</button>'+
  '<button class="btn bd bsm" onclick="event.stopPropagation();deleteBlogEntry('+r.id+')">x</button>'+
  '</div></div></div></div>';
}
function blogFilter(q){
  var history = SEO_STATE.history||[];
  var filtered = q ? history.filter(function(r){var s=(r.title+r.businessName+r.primaryKeyword).toLowerCase();return s.indexOf(q.toLowerCase())>=0;}) : history;
  var grid = document.getElementById('blog-grid');
  if(grid) grid.innerHTML = filtered.map(function(r){return blogCard(r);}).join('') || '<div class="empty" style="min-height:80px"><div>No results for "'+ec(q)+'"</div></div>';
}
function openBlog(id){
  var r = (SEO_STATE.history||[]).find(function(x){return x.id===id;});
  if(!r)return;
  SEO_STATE.result = r; SEO_STATE.originalContent = r.content;
  go('seoblog');
  setTimeout(function(){ seoRenderResult(r); }, 100);
}
function downloadBlogTxt(id){
  var r=(SEO_STATE.history||[]).find(function(x){return x.id===id;});if(!r)return;
  var blob=new Blob([r.content],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Blog-'+(r.businessName||'post').replace(/\s+/g,'-')+'.txt';a.click();
}
function downloadBlogWord(id){
  var r=(SEO_STATE.history||[]).find(function(x){return x.id===id;});if(!r)return;
  var orig=SEO_STATE.result;SEO_STATE.result=r;seoWord();SEO_STATE.result=orig;
}
function deleteBlogEntry(id){
  if(!confirm('Delete this blog post?'))return;
  SEO_STATE.history=(SEO_STATE.history||[]).filter(function(x){return x.id!==id;});
  localStorage.setItem('seo_blog_history',JSON.stringify(SEO_STATE.history));
  go('bloglibrary');
}
function clearBlogLibrary(){
  if(!confirm('Delete ALL saved blog posts? This cannot be undone.'))return;
  SEO_STATE.history=[];localStorage.removeItem('seo_blog_history');go('bloglibrary');
}
</script>
